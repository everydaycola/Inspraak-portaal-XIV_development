services:
  postgres_citizenpanel_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: 'CitizenPanel_DB'
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    networks:
      - backend
    volumes:
      - ./citizenpanel/postgres/data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    networks:
      - backend
networks:
  backend:
    name: citizenpanel-backend-network
    driver: bridge